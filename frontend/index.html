<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CashOut Forecast | MHA - I4C Cyber Intelligence Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    /* Specific Login Portal Styles */
    body.login-body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 20%, #111a36 0%, #080c18 60%, #04060c 100%);
      position: relative;
      overflow: hidden;
      font-family: 'Outfit', sans-serif;
    }
    .cyber-grid-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: 
        linear-gradient(rgba(59, 130, 246, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59, 130, 246, 0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }
    .radar-pulse-ring {
      position: absolute;
      width: 700px;
      height: 700px;
      border-radius: 50%;
      border: 1px dashed rgba(59, 130, 246, 0.15);
      animation: pulseRadar 14s linear infinite;
      pointer-events: none;
    }
    @keyframes pulseRadar {
      0% { transform: scale(0.6) rotate(0deg); opacity: 0.2; }
      50% { transform: scale(1.1) rotate(180deg); opacity: 0.4; }
      100% { transform: scale(0.6) rotate(360deg); opacity: 0.2; }
    }
    .login-container {
      width: 100%;
      max-width: 460px;
      background: rgba(15, 22, 41, 0.85);
      border: 1px solid rgba(99, 140, 255, 0.25);
      backdrop-filter: blur(16px);
      border-radius: 16px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 35px rgba(59, 130, 246, 0.12);
      padding: 2.5rem;
      position: relative;
      z-index: 10;
    }
    .portal-emblem {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 1.5rem;
    }
    .emblem-icon {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(37, 99, 235, 0.5);
    }
    .emblem-icon svg {
      width: 28px;
      height: 28px;
      fill: #ffffff;
    }
    .org-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      color: #60a5fa;
      text-transform: uppercase;
      font-weight: 600;
    }
    .portal-title {
      font-size: 1.45rem;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: -0.02em;
    }
    .portal-sub {
      font-size: 0.83rem;
      color: #94a3b8;
      line-height: 1.4;
      margin-top: 0.2rem;
    }
    .badge-bar {
      display: flex;
      gap: 8px;
      margin: 1.25rem 0;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .gov-badge {
      font-size: 0.7rem;
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(148, 163, 184, 0.15);
      color: #cbd5e1;
      font-family: 'JetBrains Mono', monospace;
    }
    .login-field {
      margin-bottom: 1.25rem;
    }
    .login-field label {
      display: block;
      font-size: 0.82rem;
      font-weight: 500;
      color: #cbd5e1;
      margin-bottom: 0.4rem;
    }
    .login-field input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: rgba(10, 14, 26, 0.8);
      border: 1px solid rgba(99, 140, 255, 0.2);
      border-radius: 8px;
      color: #f8fafc;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      transition: all 0.2s ease;
      box-sizing: border-box;
    }
    .login-field input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
      background: rgba(10, 14, 26, 0.95);
    }
    .quick-creds {
      margin-top: 1.25rem;
      padding: 0.85rem;
      background: rgba(17, 24, 39, 0.6);
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .quick-creds-title {
      font-size: 0.72rem;
      font-family: 'JetBrains Mono', monospace;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }
    .quick-btn-group {
      display: flex;
      gap: 8px;
    }
    .quick-btn {
      flex: 1;
      padding: 6px 10px;
      background: rgba(37, 99, 235, 0.15);
      border: 1px solid rgba(37, 99, 235, 0.3);
      color: #93c5fd;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: center;
      font-family: 'Outfit', sans-serif;
    }
    .quick-btn:hover {
      background: rgba(37, 99, 235, 0.3);
      border-color: #60a5fa;
      color: #ffffff;
    }
    .submit-btn {
      width: 100%;
      padding: 0.85rem;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border: none;
      border-radius: 8px;
      color: #ffffff;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
      margin-top: 1rem;
    }
    .submit-btn:hover {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6);
      transform: translateY(-1px);
    }
    .error-box {
      display: none;
      padding: 0.75rem;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 8px;
      color: #fca5a5;
      font-size: 0.82rem;
      margin-bottom: 1rem;
    }
    .status-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: #64748b;
      font-family: 'JetBrains Mono', monospace;
    }
    .live-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      background: #10b981;
      border-radius: 50%;
      margin-right: 5px;
      box-shadow: 0 0 8px #10b981;
    }
  </style>
</head>
<body class="login-body">
  <div class="cyber-grid-overlay"></div>
  <div class="radar-pulse-ring"></div>

  <div class="login-container">
    <div class="portal-emblem">
      <div class="emblem-icon">
        <svg viewBox="0 0 24 24">
          <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
        </svg>
      </div>
      <div>
        <div class="org-tag">MHA • I4C • CIS DIVISION</div>
        <div class="portal-title">CashOut Forecast</div>
        <div class="portal-sub">Predictive Cybercrime Interception Engine</div>
      </div>
    </div>

    <div class="badge-bar">
      <span class="gov-badge">SIH 2026 PROTOTYPE</span>
      <span class="gov-badge">SHA-256 AUDIT VERIFIED</span>
      <span class="gov-badge">LIGHTGBM RANKING</span>
    </div>

    <div id="errorAlert" class="error-box"></div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="login-field">
        <label for="username">Investigator / Officer ID</label>
        <input type="text" id="username" required autocomplete="username" placeholder="e.g. investigator">
      </div>
      <div class="login-field">
        <label for="password">Security Clearance Credential</label>
        <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
      </div>

      <button type="submit" id="loginBtn" class="submit-btn">
        <span>Authenticate & Access Platform</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>

      <div class="quick-creds">
        <div class="quick-creds-title">Demo Quick-Fill Credentials</div>
        <div class="quick-btn-group">
          <button type="button" class="quick-btn" onclick="fillCreds('investigator', 'inv123')">
            Investigator (inv123)
          </button>
          <button type="button" class="quick-btn" onclick="fillCreds('admin', 'admin123')">
            Admin (admin123)
          </button>
        </div>
      </div>
    </form>

    <div class="status-footer">
      <div><span class="live-dot"></span>I4C API NODE ACTIVE</div>
      <div>CONFIDENTIAL // GOVT USE</div>
    </div>
  </div>

  <script>
    function fillCreds(u, p) {
      document.getElementById('username').value = u;
      document.getElementById('password').value = p;
    }

    async function handleLogin(e) {
      e.preventDefault();
      const errBox = document.getElementById('errorAlert');
      const btn = document.getElementById('loginBtn');
      errBox.style.display = 'none';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      btn.disabled = true;
      btn.innerHTML = '<span>Verifying clearance...</span>';

      try {
        const resp = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        if (!resp.ok) {
          const data = await resp.json().catch(() => ({}));
          throw new Error(data.detail || 'Authentication failed. Please check credentials.');
        }

        const data = await resp.json();
        localStorage.setItem('cashout_token', data.access_token);
        localStorage.setItem('cashout_user', JSON.stringify({
          username: data.username,
          role: data.role
        }));

        btn.innerHTML = '<span>Clearance Verified. Redirecting...</span>';
        window.location.href = '/app';
      } catch (err) {
        errBox.textContent = err.message;
        errBox.style.display = 'block';
        btn.disabled = false;
        btn.innerHTML = '<span>Authenticate & Access Platform</span>';
      }
    }

    // Auto-fill investigator by default for hackathon evaluators
    window.addEventListener('DOMContentLoaded', () => {
      fillCreds('investigator', 'inv123');
    });
  </script>
</body>
</html>
